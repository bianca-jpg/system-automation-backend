# ============================================================================
# Secret Scanning — CI Pipeline
# Roda em todo push e PR para develop/main. Falha se segredos forem detectados.
# ============================================================================
name: Secret Scanning

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks/gitleaks-action@v2 passou a exigir GITLEAKS_LICENSE (mudança
      # da própria gitleaks em 2024, ver github.com/gitleaks/gitleaks-action).
      # O binário gitleaks em si continua open-source/MIT — rodamos ele direto,
      # sem depender da Action paga.
      - name: Instalar gitleaks (binário OSS)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          chmod +x gitleaks

      - name: Executar Gitleaks
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact -v

  detect-secrets:
    name: detect-secrets (baseline check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar detect-secrets
        run: pip install detect-secrets

      - name: Escanear segredos e atualizar o baseline localmente
        run: |
          # Regenera o baseline com o scan atual. Se o repo tiver segredo novo
          # (ou algo tiver sido removido do código sem atualizar o baseline
          # commitado), o arquivo regenerado diverge do commitado — a etapa
          # seguinte falha o job nesse caso.
          detect-secrets scan \
            --baseline .secrets.baseline \
            --exclude-files 'uv\.lock$' \
            --exclude-files '\.env\.example$'

      - name: Falhar se o baseline commitado estiver desatualizado
        run: |
          # git diff --exit-code não serve aqui: o campo generated_at do
          # baseline muda a cada scan, então sempre haveria diff. Compara o
          # conteúdo ignorando esse campo.
          python -c "
          import json, subprocess, sys
          committed = json.loads(subprocess.check_output(['git', 'show', 'HEAD:.secrets.baseline']))
          with open('.secrets.baseline') as f:
              current = json.load(f)
          committed.pop('generated_at', None)
          current.pop('generated_at', None)
          if committed != current:
              print('Baseline desatualizado: rode detect-secrets scan --baseline .secrets.baseline localmente e commite o resultado.')
              sys.exit(1)
          print('Baseline OK, nada de novo.')
          "
